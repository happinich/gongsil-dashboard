services:
  - type: web
    name: gongsil-dashboard
    runtime: python
    plan: starter
    buildCommand: python3 -m pip install --upgrade pip
    startCommand: python3 scripts/run_dashboard.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GONGSIL_DB
        value: /var/data/gongsil.sqlite3
      - key: GONGSIL_COLLECTION_DISTRICTS
        value: 강남구
      - key: GONGSIL_ID
        sync: false
      - key: GONGSIL_PASSWORD
        sync: false
      - key: DASHBOARD_USER
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    disk:
      name: gongsil-data
      mountPath: /var/data
      sizeGB: 1
